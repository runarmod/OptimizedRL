# CORL on the Dynamic Assortment Problem (paper 02, Hoppe et al. 2025).
# Main method: 2 value pieces + pairwise item interactions, solved with SCIP
# branch-and-bound. The candidates are the leaves of SCIP's tree (pruned nodes
# completed by NNS-3), each scored by the exact Q of the assortment it
# executes ("completed" node values, a bias correction of CORL eq. 12).
# Ablations: config_dap_lpbound.yaml (the paper's LP-bound node values),
# config_dap_exact.yaml (exact softmax over all assortments) and
# config_dap_linear.yaml (paper 02's linear top-k actor).
# Run with: uv run python train.py --config config_dap.yaml
name: "dap corl scip"

wandb_mode: "online"

problem: "dap"

numpy_seed: 0
load: False
load_path: null

device: "cpu"

training:
  algorithm: "ppo"
  # SCIP with presolve, cuts, heuristics, propagation, conflict analysis and
  # symmetry handling off, so it branches instead of closing the gap at the
  # root; the candidate pool is the leaves of the explored tree.
  solver: "scip_brute"

scip_brute:
  verbose: false
  disable_heuristics: true
  disable_presolve: true
  disable_separating: true
  disable_propagation: true
  disable_conflict_analysis: true
  disable_symmetry: true
  prefer_most_fractional_branching: false
  prefer_breadth_first: false
  tighten_integer_projected_bounds: false
  mimic_bnb_pool_filter: false
  prefer_depth_first: true
  # Per-node LP details are only used for logging; skipping them is ~35% faster.
  collect_lp_details: false
  # Trees grow as training improves the policy (~20 leaves at the start,
  # ~100 after 40 iterations, ~700 ms/solve). 50 nodes keeps ~25 candidate
  # assortments at ~250 ms/solve. null = full tree.
  node_limit: 50
  # If the tree collapses (integral root LP: one candidate, no gradient), add
  # the best depth-1 branch nodes up to 8 candidates. In the first 10-seed run
  # two seeds got stuck with a single candidate in 65-82% of steps.
  min_pool_size: 8

dap:
  n_value_pieces: 2
  # Pairwise interactions make the LP relaxation fractional (~95% of states),
  # so SCIP builds a real tree (~17 leaves on average, mostly pruned nodes).
  pairwise: true
  # completed = score each candidate by its executed assortment's exact Q.
  # With the paper's lp_bound, pruned nodes' (weak) LP bounds barely relate to
  # what is executed and learning stalls.
  node_values: "completed"
  k: 4
  train_seeds: [1, 100]
  seed_order: "cycle"
  # Paper 02 starts from models earning 100-200 on episodes 1-10.
  init_reward_range: [100.0, 200.0]
  nns_neighbours: 3
  eval_every: 5
  eval_episodes: 30
  selection: "train_val_mean"
  save_best: true

plotting:
  window_size: 10

ppo:
  # The environment's reward is revenue, so maximise it.
  minimize_env_reward: False
  normalize_rewards: True
  reward_norm_eps: 1.0e-8
  reward_clip: null
  gamma: 0.99
  gae_lambda: 0.95
  clip_param: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  actor_lr: 0.001
  critic_lr: 0.005
  policy_beta: 1
  normalize_obj_values: true
  obj_norm_eps: 1.0e-8
  opt_epochs: 10
  mini_batch_size: 32
  # Two episodes of 80 steps per rollout.
  rollout_iters: 160
  target_kl: 0.01
  normalize_adv: True
  nn_sample: True

reset_env_each_rollout: false

# 400 iterations x 2 episodes = 800 training episodes (~5-6 h per seed with
# SCIP). The first 200-iteration run stopped while most seeds still improved;
# check dap/val_delta_greedy_pct in wandb and extend if it is still rising.
total_iters: 400

explicit_sol_time: 4
comp_expected: False
comp_expected_every: 100
terminal_log_every: 100
