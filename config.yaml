name: "Seed1 gradient"

wandb_mode: "online"

problem: "portfolio"
portfolio_zero_init_seeds: [5, 6, 7]

numpy_seed: 5
load: False
load_path: "params/k4g2v0ol.yaml"

device: "cuda"

scip:
  verbose: false

scip_brute:
  verbose: false
  disable_heuristics: true
  disable_presolve: true
  disable_separating: true
  disable_propagation: true
  disable_conflict_analysis: true
  disable_symmetry: true
  prefer_most_fractional_branching: false
  prefer_breadth_first: false
  tighten_integer_projected_bounds: false
  mimic_bnb_pool_filter: false
  prefer_depth_first: true

training:
  # options: vanilla_gradient | ppo
  algorithm: "ppo"
  # options: scip | scip_brute | bnb
  solver: "scip"

model:
  state_size: 6
  action_size: 3
  n_cons: 4
  n_value_func: 2
  penalty_factor: 1000

gym:
  pf: 30
  noise_std: 1

plotting:
  window_size: 10

critic:
  lr: 0.01
  df: 0.9
  eps: 0.01

actor:
  sampled_grad: True
  nn_sample: True
  lr: 0.001
  beta: 0.05
  sample: False
  num_samples: 0.3

portfolio_model:
  lr_mult_aA: 1.0
  lr_mult_aB: 1.0
  lr_mult_b: 1.0
  position_dynamics_mode: "trade_stateful"

portfolio_env:
  transaction_cost: 0.0001
  holding_cost: 0.00001
  budget_cap: 750
  initial_cash: 1000
  cash_interest_rate: 0.0
  risk_cap: 750
  risk_weight: 1.0
  asset_max_position: 10
  action_mode: "target"
  reward_mode: "legacy"
  inventory_penalty: 0.05
  market_mode: "returns"
  return_mu: 0.0
  return_phi: 0.9
  return_sigma: 0.02
  alpha_mode: "on"
  alpha_rho: 0.9
  alpha_sigma: 0.02
  alpha_to_return: 0.8
  signal_noise_std: 0.002
  return_signal_scale: 2.0
  cvar_mode: "on"
  cvar_cap: 0.12
  cvar_alpha: 0.95
  cvar_n_scenarios: 40
  cvar_obj_weight: 0.2
  price_levels_mode: "on"
  initial_asset_price: 100.0
  min_asset_price: 1.0

ppo:
  # Keep PPO aligned with your objective: minimize env reward.
  minimize_env_reward: True
  # Normalize rewards only for PPO update stability.
  normalize_rewards: True
  reward_norm_eps: 1.0e-8
  # Set null to disable clipping of transformed rewards.
  reward_clip: null
  gamma: 0.99
  gae_lambda: 0.95
  clip_param: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  actor_lr: 0.005
  critic_lr: 0.001
  policy_beta: 1
  # Normalize MILP objective values before softmax logits for seed-robust ratios.
  normalize_obj_values: true
  obj_norm_eps: 1.0e-8
  opt_epochs: 20
  mini_batch_size: 32
  rollout_iters: 64
  target_kl: 0.01
  normalize_adv: True

train_iters: 20
rollout_iters: 1000
total_iters: 100000

explicit_sol_time: 4
comp_expected: False
comp_expected_every: 100
terminal_log_every: 100
