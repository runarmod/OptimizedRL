# CORL on the Dynamic Assortment Problem (paper 02, Hoppe et al. 2025).
# Ablation: the exact CORL policy, a softmax over all 4845 assortments
# (CORL eq. 10), without the B&B approximation. Same MILP as config_dap.yaml.
# Run with: uv run python train.py --config config_dap_exact.yaml
name: "dap corl exact"

wandb_mode: "online"

problem: "dap"

numpy_seed: 0
load: False
load_path: null

device: "cpu"

training:
  algorithm: "ppo"
  solver: "exact_assortment"

exact_assortment:
  # null = all assortments (exact eq. 10).
  max_candidates: null

dap:
  n_value_pieces: 2
  k: 4
  train_seeds: [1, 100]
  seed_order: "cycle"
  # Paper 02 starts from models earning 100-200 on episodes 1-10.
  init_reward_range: [100.0, 200.0]
  nns_neighbours: 3
  eval_every: 5
  eval_episodes: 30
  selection: "train_val_mean"
  save_best: true

plotting:
  window_size: 10

ppo:
  # The environment's reward is revenue, so maximise it.
  minimize_env_reward: False
  normalize_rewards: True
  reward_norm_eps: 1.0e-8
  reward_clip: null
  gamma: 0.99
  gae_lambda: 0.95
  clip_param: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  actor_lr: 0.001
  critic_lr: 0.005
  policy_beta: 1
  normalize_obj_values: true
  obj_norm_eps: 1.0e-8
  opt_epochs: 10
  mini_batch_size: 32
  # Two episodes of 80 steps per rollout.
  rollout_iters: 160
  target_kl: 0.01
  normalize_adv: True
  nn_sample: True

reset_env_each_rollout: false

# 200 iterations x 2 episodes = 400 training episodes.
total_iters: 200

explicit_sol_time: 4
comp_expected: False
comp_expected_every: 100
terminal_log_every: 100
